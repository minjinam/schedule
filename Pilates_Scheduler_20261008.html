<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>필라테스 스케줄러</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#182b42;font:16px/1.5 system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d4dce6;background:white;border-radius:0;padding:9px 14px;color:#233d58}button:hover{background:#edf3fa}button.primary{background:#285e98;color:white;border-color:#285e98}input[type=checkbox]{appearance:none;-webkit-appearance:none;width:16px;height:16px;min-width:16px;padding:0;margin:0 6px 0 0;border:1px solid #285e98;background:#fff;display:inline-grid;place-content:center;vertical-align:middle;overflow:hidden}input[type=checkbox]::before{content:'';width:8px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) scale(0);transform-origin:center;margin-top:-1px}input[type=checkbox]:checked{background:#285e98;border-color:#285e98}input[type=checkbox]:checked::before{transform:rotate(-45deg) scale(1)}header{background:white;border-bottom:1px solid #dde4ed;padding:22px 32px;display:flex;justify-content:space-between;align-items:center;gap:20px}.header-actions{display:flex;gap:8px;align-items:center}.reset-btn{color:#8d3f35;border-color:#d9b8b2;background:#fff}h1{font-size:23px;margin:0}small{font-size:13px;color:#64758a}main{max-width:1600px;margin:auto;padding:24px;display:grid;grid-template-columns:300px 1fr;gap:24px}.panel{background:white;border:1px solid #dce3eb;border-radius:0;padding:20px;margin-bottom:18px}h2{font-size:17px;margin:0 0 16px}label{font-size:14px;display:block;margin:12px 0 5px}input,select,textarea{border:1px solid #cbd6e1;padding:9px;border-radius:0;width:100%;background:white;color:#182b42}textarea{min-height:130px;font-size:14px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.toolbar .row>*{flex:0 0 auto}.toolbar button{width:auto;min-width:0;white-space:nowrap}.week{font-size:21px;font-weight:700}.legend{font-size:14px;color:#64758a;margin-bottom:12px}.board-wrap{overflow:auto;border:1px solid #dce3eb;border-radius:0;background:white}.board{min-width:760px;display:grid;grid-template-columns:58px repeat(7,minmax(90px,1fr))}.heading{padding:13px 5px;text-align:center;background:#fafbfd;border-bottom:1px solid #dce3eb;font-weight:600;font-size:14px}.heading span{display:block;font-size:12px;color:#78889b}.hours{position:relative;background:white}.hour{height:60px;border-bottom:1px solid #eef1f5;font-size:12px;color:#78889b;text-align:center;padding-top:3px}.day{position:relative;border-left:1px solid #e5eaf0;background:repeating-linear-gradient(to bottom,#f3f5f8 0,#f3f5f8 59px,#e6ebf1 59px,#e6ebf1 60px)}.available{position:absolute;left:0;right:0;background:repeating-linear-gradient(to bottom,#fff 0,#fff 59px,#edf1f5 59px,#edf1f5 60px);pointer-events:none}.lunch{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,#e9edf2,#e9edf2 4px,#f5f7fa 4px,#f5f7fa 8px);font-size:12px;text-align:center;color:#6b798a;pointer-events:none}.event{position:absolute;z-index:2;border:2px solid var(--event-border,#8fb3d8);background:var(--event-bg,#e8f1fb);padding:6px 7px;font-size:13px;line-height:1.35;overflow:hidden;cursor:pointer;border-radius:0;word-break:keep-all;overflow-wrap:anywhere}.event b{display:block;font-size:15px;line-height:1.25;margin-bottom:2px}.event .time-line{display:block;font-weight:700}.event em,.event .note-line{display:block;font-size:11px;font-style:normal;margin-top:2px}.event.conflict{border-color:#9b5a3c!important;box-shadow:inset 0 0 0 1px #9b5a3c}.warning{font-size:14px;border:1px solid #e4c5ae;background:transparent;border-radius:0;padding:12px;margin:15px 0}.issue{display:block;width:100%;text-align:left;margin:6px 0;font-size:14px}.count{font-size:14px;color:#64758a}dialog{border:0;border-radius:0;padding:25px;width:min(490px,94vw);box-shadow:0 15px 60px #152a4440}dialog::backdrop{background:#14243e66}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.danger{color:#9a463c}.close{float:right;border:0;padding:3px 8px}.hint{font-size:13px;color:#697a8e;margin:8px 0}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#223d58;color:white;padding:12px 22px;border-radius:0;z-index:20;display:none}.sample{margin-top:8px;padding:10px;border:1px solid #d8e0ea;background:#fafbfd;font-size:13px;color:#4a5b70;white-space:pre-line}@media(max-width:1000px){main{grid-template-columns:240px 1fr;padding:16px;gap:16px}header{padding:18px}}@media(max-width:760px){main{display:flex;flex-direction:column}.sidebar{display:grid;grid-template-columns:1fr;gap:0}.toolbar .week{font-size:18px}header{align-items:flex-start}header small{display:none}.panel{padding:16px}header button{font-size:14px}}
</style><header><div><h1>필라테스 스케줄러</h1></div><div class="header-actions"><button id="reset" class="reset-btn">초기화</button><button class="primary" id="export">이미지 저장</button></div></header><main><aside class="sidebar"><section class="panel"><h2>나의 근무 시간</h2><label>요일</label><select id="settingDay"></select><label><input type="checkbox" id="working" style="width:auto"> 근무 가능한 날</label><label>근무 가능 시간</label><div class="row"><input type="time" id="workStart" aria-label="근무 시작"><span style="flex:0">–</span><input type="time" id="workEnd" aria-label="근무 종료"></div><label><input type="checkbox" id="lunchEnabled" style="width:auto"> 선택한 요일의 점심시간 설정</label><div class="row"><input type="time" id="lunchStart" aria-label="점심 시작"><span style="flex:0">–</span><input type="time" id="lunchEnd" aria-label="점심 종료"></div><button id="saveSetting" class="primary" style="width:100%;margin-top:16px">시간 적용</button><p class="hint">근무 시간과 점심시간은 요일마다 따로 저장되어 매주 적용됩니다.</p></section><section class="panel"><h2>고객 일정</h2><label>고객 이름</label><input id="bulkName" maxlength="50" placeholder="예: 김민지" aria-label="고객 이름 입력"><label>일정 입력</label><textarea id="bulk" placeholder="예: 월 11:00-15:00&#10;수요일 10시~13시&#10;금 16:00~18:00 리포머" aria-label="고객 일정 입력"></textarea><button id="bulkAdd" class="primary" style="width:100%;margin-top:10px">고객 일정 추가</button><p class="hint">고객 이름을 먼저 입력하고 아래에는 일정만 적어주세요. 같은 줄에 여러 요일을 적어도 요일과 시간을 분석해 각각 분류합니다.</p><div class="sample">입력 예시
월 11:00-15:00
수요일 10시~13시
금 16:00~18:00 캐딜락</div></section></aside><section><div class="toolbar"><div class="row" style="flex:none"><button id="prev" aria-label="이전 주">‹</button><div id="weekTitle" class="week"></div><button id="next" aria-label="다음 주">›</button></div><div class="row" style="flex:none"><button id="today">이번 주</button><button class="primary" id="add">수업 추가</button></div></div><div class="toolbar"><div class="legend">흰색 근무 가능 · 빗금 점심 · 회색 근무 외</div><div class="count" id="count"></div></div><div class="board-wrap"><div class="board" id="board"></div></div><div id="issues"></div><p class="hint">빈 시간을 클릭해 수업을 추가하거나, 수업을 클릭해 수정하세요. 일정은 현재 브라우저에 자동 저장됩니다.</p></section></main><dialog id="editor"><button class="close" id="close" aria-label="닫기">✕</button><h2 id="editTitle">수업 추가</h2><form id="form"><label>고객 이름</label><input id="name" required maxlength="50"><label>날짜</label><input id="date" type="date" required><label>수업 시간</label><div class="row"><input id="start" type="time" required aria-label="수업 시작"><span style="flex:0">–</span><input id="end" type="time" required aria-label="수업 종료"></div><label>메모</label><input id="note" maxlength="150" placeholder="기구 / 수업 메모"><div id="liveWarning" class="warning" hidden></div><div class="actions"><button type="button" class="danger" id="delete">삭제</button><button type="button" id="duplicate">복사</button><button class="primary" type="submit">저장</button></div></form></dialog><div id="toast" class="toast" role="status"></div><script>
const $=id=>document.getElementById(id),days=['월','화','수','목','금','토','일'],key='pilates-planner-v1';
const palette=[
  {bg:'#e8f1fb',border:'#7da5ce'},
  {bg:'#f7ecdf',border:'#b38158'},
  {bg:'#e8f5ec',border:'#71a67e'},
  {bg:'#f0e9fb',border:'#8d7ab8'},
  {bg:'#e8f6f8',border:'#6c9aa8'},
  {bg:'#f9ecef',border:'#b37a8e'}
];
let data;try{data=JSON.parse(localStorage.getItem(key))}catch{};data=data||{events:[],settings:days.map((_,i)=>({working:i<5,start:'09:00',end:'18:00',lunch:true,ls:'12:00',le:'13:00'}))};
let week=monday(new Date()),editing=null;
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function from(s){return new Date(s+'T12:00:00')}
function monday(d){d=new Date(d);d.setHours(12,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
function plus(d,n){d=new Date(d);d.setDate(d.getDate()+n);return d}
function min(t){let [h,m]=t.split(':').map(Number);return h*60+m}
function time(m){return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch{toast('저장 공간이 부족합니다. 이 화면을 닫기 전 이미지를 저장하세요.')}render()}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',3000)}
function visible(){return data.events.filter(e=>e.date>=iso(week)&&e.date<=iso(plus(week,6)))}
function problems(e){let p=[],s=data.settings[(from(e.date).getDay()+6)%7],a=min(e.start),b=min(e.end);if(!s.working||a<min(s.start)||b>min(s.end))p.push('근무 가능 시간 외');if(s.working&&s.lunch&&a<min(s.le)&&b>min(s.ls))p.push('점심시간과 겹침');if(data.events.some(x=>x.id!==e.id&&x.date===e.date&&min(x.start)<b&&min(x.end)>a))p.push('다른 수업과 겹침');return p}
function bounds(){let ts=[...visible().flatMap(e=>[min(e.start),min(e.end)]),...data.settings.filter(s=>s.working).flatMap(s=>[min(s.start),min(s.end)])];if(!ts.length)ts=[9*60,18*60];return [Math.min(8*60,Math.floor(Math.min(...ts)/60)*60),Math.max(19*60,Math.ceil(Math.max(...ts)/60)*60)]}
function colorForName(name){let h=0;for(const ch of name)h=(h*31+ch.charCodeAt(0))>>>0;return palette[h%palette.length]}
function layoutDayEvents(list){
  const sorted=[...list].sort((a,b)=>min(a.start)-min(b.start)||min(a.end)-min(b.end));
  const clusters=[];
  for(const e of sorted){
    const s=min(e.start),en=min(e.end);
    let cluster=clusters.at(-1);
    if(!cluster||s>=cluster.end){cluster={events:[],end:en};clusters.push(cluster)}
    cluster.events.push(e);cluster.end=Math.max(cluster.end,en);
  }
  const placed=[];
  for(const cluster of clusters){
    const colEnds=[];
    const temp=[];
    for(const e of cluster.events){
      const s=min(e.start),en=min(e.end);
      let col=colEnds.findIndex(end=>end<=s);
      if(col===-1){col=colEnds.length;colEnds.push(en)}else colEnds[col]=en;
      temp.push({event:e,col});
    }
    const cols=Math.max(1,colEnds.length);
    temp.forEach(item=>placed.push({...item,cols}));
  }
  return placed;
}
function render(){
  let ev=visible(),[lo,hi]=bounds();
  $('weekTitle').textContent=`${iso(week).replaceAll('-','.')} – ${iso(plus(week,6)).slice(5).replace('-','.')}`;
  $('count').textContent=`수업 ${ev.length}개 · 고객 ${new Set(ev.map(e=>e.name)).size}명`;
  let html='<div class="heading">시간</div>'+days.map((d,i)=>`<div class="heading">${d}<span>${iso(plus(week,i)).slice(5).replace('-','.')}</span></div>`).join('');
  html+='<div class="hours">';
  for(let m=lo;m<hi;m+=60)html+=`<div class="hour">${time(m)}</div>`;
  html+='</div>';
  days.forEach((d,i)=>{
    let s=data.settings[i],date=iso(plus(week,i));
    html+=`<div class="day" data-day="${i}" style="height:${hi-lo}px">`;
    if(s.working){html+=`<div class="available" style="top:${min(s.start)-lo}px;height:${min(s.end)-min(s.start)}px"></div>`;if(s.lunch)html+=`<div class="lunch" style="top:${min(s.ls)-lo}px;height:${min(s.le)-min(s.ls)}px">점심</div>`}
    const list=ev.filter(e=>e.date===date);
    const placed=layoutDayEvents(list);
    for(const item of placed){
      const e=item.event,p=problems(e),c=colorForName(e.name),gap=2,leftPct=item.col*100/item.cols,widthPct=100/item.cols;
      html+=`<div tabindex="0" role="button" aria-label="${esc(e.name)} ${e.start} 수정" class="event ${p.length?'conflict':''}" data-id="${e.id}" style="top:${min(e.start)-lo}px;height:${Math.max(42,min(e.end)-min(e.start))}px;left:calc(${leftPct}% + ${gap}px);width:calc(${widthPct}% - ${gap*2}px);--event-bg:${c.bg};--event-border:${c.border}"><b>${esc(e.name)}</b><span class="time-line">${e.start}–${e.end}</span>${e.note?'<span class="note-line">'+esc(e.note)+'</span>':''}${p.length?'<em>확인 필요</em>':''}</div>`;
    }
    html+='</div>';
  });
  $('board').innerHTML=html;
  let bad=ev.filter(e=>problems(e).length);
  $('issues').innerHTML=bad.length?`<div class="warning"><b>확인할 일정 ${bad.length}개</b><div class="hint">일정을 클릭해 날짜나 시간을 수정하세요.</div>${bad.map(e=>`<button class="issue" data-id="${e.id}">${esc(e.name)} · ${e.date} ${e.start} — ${problems(e).join(' / ')}</button>`).join('')}</div>`:'';
}
$('settingDay').innerHTML=days.map((d,i)=>`<option value="${i}">${d}요일</option>`).join('');
function setting(){let s=data.settings[+$('settingDay').value];$('working').checked=s.working;$('workStart').value=s.start;$('workEnd').value=s.end;$('lunchEnabled').checked=s.lunch;$('lunchStart').value=s.ls;$('lunchEnd').value=s.le}
$('settingDay').onchange=setting;
$('saveSetting').onclick=()=>{let s={working:$('working').checked,start:$('workStart').value,end:$('workEnd').value,lunch:$('lunchEnabled').checked,ls:$('lunchStart').value,le:$('lunchEnd').value};if(!s.start||!s.end||min(s.end)<=min(s.start))return toast('근무 종료 시간을 시작 시간 이후로 설정하세요.');if(s.lunch&&(!s.ls||!s.le||min(s.le)<=min(s.ls)||min(s.ls)<min(s.start)||min(s.le)>min(s.end)))return toast('점심시간은 근무 시간 안에 설정하세요.');data.settings[+$('settingDay').value]=s;save();toast('근무 시간이 적용되었습니다.')};
function open(e,date,start){editing=e?.id||null;$('editTitle').textContent=e?'수업 수정':'수업 추가';$('name').value=e?.name||'';$('date').value=e?.date||date||iso(week);$('start').value=e?.start||start||'09:00';$('end').value=e?.end||time(Math.min(1439,min($('start').value)+50));$('note').value=e?.note||'';$('delete').hidden=!e;$('duplicate').hidden=!e;warn();$('editor').showModal()}
function candidate(){return {id:editing,name:$('name').value.trim(),date:$('date').value,start:$('start').value,end:$('end').value,note:$('note').value.trim()}}
function warn(){let e=candidate(),p=e.date&&e.start&&e.end?problems(e):[];$('liveWarning').hidden=!p.length;$('liveWarning').textContent=p.join(' / ')+' · 저장 후에도 수정할 수 있습니다.'}
['date','start','end'].forEach(id=>$(id).oninput=warn);
$('form').onsubmit=e=>{e.preventDefault();let x=candidate();if(!x.name)return toast('고객 이름을 입력하세요.');if(min(x.end)<=min(x.start))return toast('종료 시간은 시작 시간 이후여야 합니다.');x.id=editing||crypto.randomUUID();if(editing)data.events=data.events.map(e=>e.id===editing?x:e);else data.events.push(x);week=monday(from(x.date));save();$('editor').close()};
$('close').onclick=()=>$('editor').close();
$('delete').onclick=()=>{data.events=data.events.filter(e=>e.id!==editing);save();$('editor').close()};
$('duplicate').onclick=()=>{editing=null;$('editTitle').textContent='복사한 수업';$('delete').hidden=true;$('duplicate').hidden=true;warn();toast('날짜와 시간을 조정하고 저장하세요.')};
$('add').onclick=()=>open();
document.addEventListener('click',e=>{let x=e.target.closest('[data-id]');if(x)return open(data.events.find(t=>t.id===x.dataset.id));let d=e.target.closest('.day');if(d){let [lo]=bounds(),m=Math.min(1380,Math.max(0,Math.floor((e.clientY-d.getBoundingClientRect().top+lo)/15)*15));open(null,iso(plus(week,+d.dataset.day)),time(m))}});
$('board').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.id){e.preventDefault();open(data.events.find(t=>t.id===e.target.dataset.id))}};
$('prev').onclick=()=>{week=plus(week,-7);render()};
$('next').onclick=()=>{week=plus(week,7);render()};
$('today').onclick=()=>{week=monday(new Date());render()};
function normalizeLine(line){return line.replace(/\u00a0/g,' ').replace(/[–—~～]/g,'-').replace(/[，]/g,',').replace(/\s+/g,' ').trim()}
function parseTimePart(token){
  token=normalizeLine(token).replace(/\./g,':');
  let ampm='';
  const ampmMatch=token.match(/(오전|오후|am|pm)/i); if(ampmMatch) ampm=ampmMatch[1].toLowerCase();
  token=token.replace(/(오전|오후|am|pm)/ig,'').trim();
  let h,m;
  if(/\d{1,2}:\d{1,2}/.test(token)){let x=token.match(/(\d{1,2}):(\d{1,2})/);h=+x[1];m=+x[2];}
  else if(/\d{1,2}\s*시\s*\d{1,2}\s*분?/.test(token)){let x=token.match(/(\d{1,2})\s*시\s*(\d{1,2})\s*분?/);h=+x[1];m=+x[2];}
  else if(/\d{1,2}\s*시/.test(token)){let x=token.match(/(\d{1,2})\s*시/);h=+x[1];m=0;}
  else if(/^\d{1,2}$/.test(token)){h=+token;m=0;}
  else return null;
  if((ampm==='오후'||ampm==='pm')&&h<12)h+=12;
  if((ampm==='오전'||ampm==='am')&&h===12)h=0;
  if(h>23||m>59)return null;
  return h*60+m;
}
function extractRange(line){
  let normalized=normalizeLine(line)
    .replace(/(부터|에서|부터\s*)/g,'-')
    .replace(/(까지)/g,'')
    .replace(/\bto\b/ig,'-');
  const t='(?:오전|오후|am|pm)?\\s*\\d{1,2}(?::\\d{1,2})?(?:\\s*시)?(?:\\s*\\d{1,2}\\s*분?)?';
  const rangeMatch=normalized.match(new RegExp('('+t+')\\s*(?:-|~|～|부터|에서)\\s*('+t+')','i'));
  if(rangeMatch){
    const a=parseTimePart(rangeMatch[1]); const b=parseTimePart(rangeMatch[2]);
    if(a!=null&&b!=null)return {start:a,end:b,matched:rangeMatch[0]};
  }
  // "11 15", "11시 15시"처럼 구분자가 없어도 두 시간을 순서대로 읽음
  const re=new RegExp(t,'ig');
  const candidates=[...normalized.matchAll(re)].map(m=>({text:m[0],minutes:parseTimePart(m[0])})).filter(x=>x.minutes!=null);
  if(candidates.length>=2)return {start:candidates[0].minutes,end:candidates[1].minutes,matched:candidates[0].text+' '+candidates[1].text};
  return null;
}
function splitScheduleText(text){
  const cleaned=text.replace(/\r/g,'\n').replace(/[;；]+/g,'\n');
  const chunks=[];
  for(const rawLine of cleaned.split('\n')){
    const line=normalizeLine(rawLine); if(!line)continue;
    const markers=[];
    const dateRe=/\d{4}[.\/-]\d{1,2}[.\/-]\d{1,2}/g;
    const dayRe=/(?:^|[\s,\/|])([월화수목금토일])(?:요일)?(?=\s|,|\/|\||\d|오전|오후|$)/g;
    let m;
    while((m=dateRe.exec(line)))markers.push({index:m.index,text:m[0]});
    while((m=dayRe.exec(line))){const idx=m.index+(m[0].length-m[0].trimStart().length);markers.push({index:idx,text:m[1]});}
    markers.sort((a,b)=>a.index-b.index);
    if(markers.length<=1){chunks.push(line);continue;}
    for(let i=0;i<markers.length;i++){
      const a=markers[i].index,b=i+1<markers.length?markers[i+1].index:line.length;
      const piece=normalizeLine(line.slice(a,b).replace(/^[,\/|\s]+|[,\/|\s]+$/g,''));
      if(piece)chunks.push(piece);
    }
  }
  return chunks;
}
function parseScheduleLine(line,name){
  const raw=normalizeLine(line);
  if(!raw)return null;
  let date='';
  let dateMatch=raw.match(/(\d{4})[.\/-](\d{1,2})[.\/-](\d{1,2})/);
  if(dateMatch){
    const d=new Date(+dateMatch[1],+dateMatch[2]-1,+dateMatch[3]);
    if(d.getFullYear()!==+dateMatch[1]||d.getMonth()!==+dateMatch[2]-1||d.getDate()!==+dateMatch[3])return {error:true};
    date=iso(d);
  }else{
    const dayMatch=raw.match(/(?:^|[\s,\/|])([월화수목금토일])(?:요일)?(?=\s|,|\/|\||\d|오전|오후|$)/);
    if(dayMatch)date=iso(plus(week,days.indexOf(dayMatch[1])));
  }
  const withoutDate=raw.replace(/\d{4}[.\/-]\d{1,2}[.\/-]\d{1,2}/g,' ');
  const range=extractRange(withoutDate);
  if(!date||!range||range.end<=range.start)return {error:true};
  // 시간/요일을 제거하고 남은 문자열만 메모로 사용
  let note=raw
    .replace(/\d{4}[.\/-]\d{1,2}[.\/-]\d{1,2}/g,' ')
    .replace(/(?:^|[\s,\/|])([월화수목금토일])(?:요일)?(?=\s|,|\/|\||\d|오전|오후|$)/g,' ')
    .replace(/(?:오전|오후|am|pm)?\s*\d{1,2}(?::\d{1,2})?(?:\s*시)?(?:\s*\d{1,2}\s*분?)?\s*(?:-|~|～|부터|에서)\s*(?:오전|오후|am|pm)?\s*\d{1,2}(?::\d{1,2})?(?:\s*시)?(?:\s*\d{1,2}\s*분?)?/ig,' ')
    .replace(/(?:오전|오후|am|pm)?\s*\d{1,2}(?::\d{1,2})?(?:\s*시)?(?:\s*\d{1,2}\s*분?)?/ig,' ')
    .replace(/(부터|에서|까지)/g,' ')
    .replace(/[-~,\/|]+/g,' ')
    .replace(/\s+/g,' ').trim();
  // 고객명을 일정 칸에 다시 적어도 메모로 중복 표시하지 않음
  if(note===name)note='';
  else if(note.startsWith(name+' '))note=note.slice(name.length).trim();
  return {id:crypto.randomUUID(),date,start:time(range.start),end:time(range.end),name,note};
}
$('bulkAdd').onclick=()=>{
  const name=$('bulkName').value.trim();
  if(!name)return toast('고객 이름을 먼저 입력하세요.');
  const text=$('bulk').value.trim();
  if(!text)return toast('일정을 입력하세요.');
  const segments=splitScheduleText(text),parsed=[],errors=[];
  segments.forEach((line,i)=>{const e=parseScheduleLine(line,name);if(!e||e.error)errors.push(`${i+1}번: ${line}`);else parsed.push(e)});
  if(errors.length)return toast(`분석하지 못한 일정이 있습니다: ${errors.slice(0,2).join(' / ')}${errors.length>2?' 외 '+(errors.length-2)+'개':''}`);
  data.events.push(...parsed);
  if(parsed.length)week=monday(from(parsed[0].date));
  $('bulk').value='';
  save();
  toast(`${name} 고객 일정 ${parsed.length}개를 요일별로 추가했습니다.`);
};
